[workspace]
resolver = "2"
members = [
    "crates/neto-core",
    "crates/neto-platform-android",
    "crates/neto-platform-windows",
    "crates/neto-platform-linux",
    "crates/neto-ffi",
    "crates/neto-ui-gtk",
    "crates/neto-service",
    "apps/linux",
]
default-members = [
    "crates/neto-core",
    "crates/neto-ffi",
]
exclude = [
    "third_party/socks5-impl",
    "third_party/tun2proxy",
]

[workspace.package]
version = "0.0.6"
edition = "2024"
license = "Apache-2.0"

[workspace.dependencies]
aerion = { git = "https://github.com/MoeclubM/Aerion.git", rev = "e92f81451b971ad31fbc781a58d58c37618e81e3", default-features = false }
anyhow = "1.0.104"
base64 = "0.22.1"
log = "0.4.34"
once_cell = "1.21.4"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider", "gzip", "stream", "json"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serde_yaml = "0.9.34"
tokio = { version = "1.54.1", features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "time", "fs"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring", "tls12"] }
webpki-roots = "1.0.11"

[patch.crates-io]
socks5-impl = { path = "third_party/socks5-impl" }
tun2proxy = { path = "third_party/tun2proxy" }
