name: CI

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

on:
  push:
    branches: ['main', 'codex/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust-core:
    name: Rust shared core tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install native build dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake pkg-config libclang-dev
      - name: Test shared Rust crates
        run: cargo test --workspace --exclude neto-ui-gtk --exclude neto-linux

  android:
    name: Android native APK (arm64-v8a)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platforms;android-37.0 build-tools;36.1.0 ndk;28.2.13676358'
      - name: Add Rust Android target
        run: rustup target add aarch64-linux-android
      - name: Build Android APK
        run: |
          chmod +x gradlew
          ./gradlew :apps:android:assembleRelease --build-cache --stacktrace
          apk="$(find apps/android/build/outputs/apk -type f -name '*-arm64-v8a-release.apk' -print -quit)"
          test -n "$apk"
          mkdir -p dist
          cp "$apk" "dist/Neto-android-arm64-v8a.apk"
      - name: Upload Android APK
        uses: actions/upload-artifact@v7
        with:
          name: neto-android-arm64-v8a
          archive: false
          path: dist/Neto-android-arm64-v8a.apk
          if-no-files-found: error

  windows:
    name: Windows WinUI 3 native (x64)
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v7
      - name: Set up .NET 9
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '9.0.x'
      - name: Install NASM
        shell: bash
        run: |
          choco install nasm --no-progress --yes
          echo 'C:/Program Files/NASM' >> "$GITHUB_PATH"
      - name: Build neto_ffi & WinUI 3 app
        shell: bash
        run: |
          cargo build --release -p neto-ffi
          mkdir -p apps/windows/native dist
          cp target/release/neto_ffi.dll apps/windows/native/
          cp target/release/wintun.dll apps/windows/native/
          dotnet publish apps/windows/Neto.Windows.csproj \
            -c Release \
            -r win-x64 \
            -o dist/Neto
          test -f dist/Neto/Neto.exe
          test -f dist/Neto/Neto.pri
          test -f dist/Neto/neto_ffi.dll
          test -f dist/Neto/wintun.dll
          powershell -NoProfile -Command "Compress-Archive -Path 'dist/Neto' -DestinationPath 'dist/Neto-windows-x64.zip' -Force"
      - name: Build Windows installer (Inno Setup)
        shell: pwsh
        run: |
          $iscc = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) {
            choco install innosetup --no-progress --yes
          }
          & $iscc '/DMyAppVersion=0.0.1' '/DOutputBaseFilename=Neto-windows-x64-setup' 'apps/windows/installer/Neto.iss'
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed with exit code $LASTEXITCODE" }
          if (-not (Test-Path 'dist/Neto-windows-x64-setup.exe')) { throw 'Neto-windows-x64-setup.exe missing' }
      - name: Upload Windows installer
        uses: actions/upload-artifact@v7
        with:
          name: neto-windows-x64-setup
          archive: false
          path: dist/Neto-windows-x64-setup.exe
          if-no-files-found: error
      - name: Upload Windows zip
        uses: actions/upload-artifact@v7
        with:
          name: neto-windows-x64
          archive: false
          path: dist/Neto-windows-x64.zip
          if-no-files-found: error

  linux-wayland:
    name: Linux Wayland GTK4 deb (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
      - name: Install GTK4 / libadwaita dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake pkg-config libclang-dev libgtk-4-dev libadwaita-1-dev dpkg-dev
      - name: Build & package Linux Wayland deb
        run: |
          cargo build --release -p neto-linux
          pkg_root="dist/pkg-neto_${{ matrix.arch }}"
          mkdir -p "$pkg_root/DEBIAN" "$pkg_root/usr/bin" "$pkg_root/usr/share/applications"
          cp target/release/neto "$pkg_root/usr/bin/neto"
          chmod 0755 "$pkg_root/usr/bin/neto"
          cp apps/linux/data/io.github.moeclubm.Neto.desktop "$pkg_root/usr/share/applications/"
          cat > "$pkg_root/DEBIAN/control" <<EOF
          Package: neto
          Version: 0.0.1
          Section: net
          Priority: optional
          Architecture: ${{ matrix.arch }}
          Depends: libc6, libgtk-4-1, libadwaita-1-0
          Maintainer: MoeclubM
          Description: Neto native subscription and proxy client for Linux Wayland
          EOF
          sed -i 's/^          //' "$pkg_root/DEBIAN/control"
          dpkg-deb --root-owner-group --build "$pkg_root" "dist/neto_0.0.1_${{ matrix.arch }}.deb"
      - name: Upload Linux deb
        uses: actions/upload-artifact@v7
        with:
          name: neto-linux-${{ matrix.arch }}
          archive: false
          path: dist/neto_0.0.1_${{ matrix.arch }}.deb
          if-no-files-found: error
