[package]
name = "neto-linux"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "neto"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
neto-core = { path = "../../crates/neto-core" }
neto-ui-gtk = { path = "../../crates/neto-ui-gtk" }
tokio.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
gtk = { package = "gtk4", version = "0.11.5", features = ["v4_14"] }
adw = { package = "libadwaita", version = "0.9.2", features = ["v1_5"] }
neto-platform-linux = { path = "../../crates/neto-platform-linux" }
